<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#170b3b">
<meta name="description" content="Brick Blitz: a neon brick-breaker with 12 handcrafted levels, 8 power-ups and explosive chain reactions.">
<title>Brick Blitz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" aria-label="Game area"></canvas>

<header class="hud" id="hud">
  <button type="button" class="icon-btn" data-action="sound" aria-label="Sound on or off">
    <svg class="i-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <svg class="i-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9.5l5 5M22 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button type="button" class="icon-btn" data-action="pause" aria-label="Pause">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>
  </button>
</header>

<p class="hint" id="hint"></p>

<section class="screen screen-title" id="screen-title" aria-labelledby="title-logo">
  <div class="panel">
    <h1 class="logo" id="title-logo"><span data-text="titleTop">BRICK</span><span data-text="titleBottom">BLITZ</span></h1>
    <p class="tagline" data-text="tagline">Smash. Power up. Blitz through 12 levels.</p>
    <p class="best-line"><span data-text="best">Best</span> <strong data-best>0</strong></p>
    <button type="button" class="btn btn-primary btn-play" data-action="play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
      <span data-text="play">Play</span>
    </button>
    <div class="row">
      <button type="button" class="btn btn-ghost" data-action="levels">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="13" y="4" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="4" y="13" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="13" y="13" width="7" height="7" rx="1.5" fill="currentColor"/></svg>
        <span data-text="levels">Levels</span>
      </button>
      <button type="button" class="btn btn-ghost" data-action="sound">
        <svg class="i-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="i-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9.5l5 5M22 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span data-sound-label>On</span>
      </button>
    </div>
    <p class="howto" data-text="howTo">Move to aim · Space / tap to launch · catch the capsules</p>
  </div>
  <p class="credit" data-credit></p>
</section>

<section class="screen screen-levels" id="screen-levels" aria-labelledby="levels-title">
  <div class="panel panel-wide">
    <h2 class="panel-heading" id="levels-title" data-text="selectLevel">Select level</h2>
    <div class="level-grid" id="level-grid"></div>
    <button type="button" class="btn btn-ghost" data-action="back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-text="back">Back</span>
    </button>
  </div>
</section>

<section class="screen screen-pause" id="screen-pause" aria-labelledby="pause-title">
  <div class="panel panel-compact">
    <h2 class="panel-heading" id="pause-title" data-text="paused">Paused</h2>
    <button type="button" class="btn btn-primary" data-action="resume">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
      <span data-text="resume">Resume</span>
    </button>
    <button type="button" class="btn btn-ghost" data-action="restart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.1-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-text="restart">Restart</span>
    </button>
    <div class="row">
      <button type="button" class="btn btn-ghost" data-action="sound">
        <svg class="i-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="i-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9.5l5 5M22 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span data-sound-label>On</span>
      </button>
      <button type="button" class="btn btn-ghost" data-action="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20h-5.5v-5h-5v5H4z" fill="currentColor"/></svg>
        <span data-text="home">Home</span>
      </button>
    </div>
  </div>
</section>

<section class="screen screen-over" id="screen-over" aria-labelledby="over-title">
  <div class="panel panel-compact">
    <h2 class="panel-heading" id="over-title" data-text="gameOver">Game over</h2>
    <p class="final" id="final-score">0</p>
    <p class="badge" id="new-best" data-text="newBest" hidden>NEW BEST!</p>
    <p class="reached" id="reached">Reached level 1</p>
    <p class="best-line"><span data-text="best">Best</span> <strong data-best>0</strong></p>
    <button type="button" class="btn btn-primary" data-action="restart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.1-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-text="playAgain">Play again</span>
    </button>
    <div class="row">
      <button type="button" class="btn btn-ghost" data-action="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20h-5.5v-5h-5v5H4z" fill="currentColor"/></svg>
        <span data-text="home">Home</span>
      </button>
      <button type="button" class="btn btn-ghost" data-action="share">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.6" fill="currentColor"/><circle cx="18" cy="6" r="2.6" fill="currentColor"/><circle cx="18" cy="18" r="2.6" fill="currentColor"/><path d="M8.3 10.8l7.4-3.6M8.3 13.2l7.4 3.6" stroke="currentColor" stroke-width="2"/></svg>
        <span data-text="share">Share</span>
      </button>
    </div>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/physics.js"></script>
<script src="js/levels.js"></script>
<script src="js/fx.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
</body>
</html>
