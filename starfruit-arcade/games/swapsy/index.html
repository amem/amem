<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8f6bff">
<meta name="description" content="Swapsy: a cute match-3 puzzle with 24 levels, special pieces and jelly. Swap. Match. Smile.">
<title>Swapsy</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-screen="title">
<canvas id="game" aria-label="Game board"></canvas>

<header class="hud" id="hud">
  <div class="hud-row">
    <div class="hud-side">
      <button type="button" class="icon-btn" data-action="pause" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>
      </button>
      <button type="button" class="icon-btn" data-action="sound" aria-label="Sound on or off">
        <svg class="i-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="i-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9.5l5 5M22 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="hud-moves"><b id="hud-moves">0</b><small data-text="moves">Moves</small></div>
    <div class="hud-side hud-side-right">
      <div class="hud-score"><small data-text="score">Score</small><b id="hud-score" aria-live="off">0</b></div>
    </div>
  </div>
  <div class="hud-row hud-row2">
    <span class="hud-level" id="hud-level">Level 1</span>
    <div class="hud-goals" id="hud-goals"></div>
    <div class="hud-starbar" aria-hidden="true"><span class="hud-bar" id="hud-bar"></span><span class="hud-stars" id="hud-stars"><i></i><i></i><i></i></span></div>
  </div>
</header>

<p class="hint" id="hint"></p>

<section class="screen screen-title" id="screen-title" aria-labelledby="title-logo">
  <div class="panel">
    <h1 class="logo" id="title-logo" aria-label="Swapsy"><span>S</span><span>W</span><span>A</span><span>P</span><span>S</span><span>Y</span></h1>
    <p class="tagline" data-text="tagline">Swap. Match. Smile.</p>
    <p class="meta"><span class="meta-star">★</span> <b data-total-stars>0</b> · <span data-text="best">Best</span> <b data-best>0</b></p>
    <button type="button" class="btn btn-primary btn-play" data-action="play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
      <span data-text="play">Play</span>
    </button>
    <div class="row">
      <button type="button" class="btn btn-ghost" data-action="levels"><span data-text="levels">Levels</span></button>
      <button type="button" class="btn btn-ghost" data-action="sound"><span data-text="sound">Sound</span>: <span data-sound-label>On</span></button>
    </div>
    <p class="howto" data-text="howTo">Swap two neighbours to line up 3 or more of the same piece.</p>
  </div>
  <p class="credit" data-credit></p>
</section>

<section class="screen screen-levels" id="screen-levels" aria-labelledby="levels-title">
  <div class="panel panel-wide">
    <h2 class="panel-heading" id="levels-title" data-text="selectLevel">Choose a level</h2>
    <div class="level-grid" id="level-grid"></div>
    <button type="button" class="btn btn-ghost" data-action="back"><span data-text="back">Back</span></button>
  </div>
</section>

<section class="screen screen-pause" id="screen-pause" aria-labelledby="pause-title">
  <div class="panel panel-compact">
    <h2 class="panel-heading" id="pause-title" data-text="paused">Paused</h2>
    <button type="button" class="btn btn-primary" data-action="resume"><span data-text="resume">Resume</span></button>
    <button type="button" class="btn btn-ghost" data-action="restart"><span data-text="restart">Restart</span></button>
    <div class="row">
      <button type="button" class="btn btn-ghost" data-action="sound"><span data-text="sound">Sound</span>: <span data-sound-label>On</span></button>
      <button type="button" class="btn btn-ghost" data-action="home"><span data-text="home">Home</span></button>
    </div>
  </div>
</section>

<section class="screen screen-over" id="screen-over" aria-labelledby="over-title">
  <div class="panel panel-compact">
    <h2 class="panel-heading" id="over-title">Level complete!</h2>
    <p class="over-level" id="over-level"></p>
    <div class="over-stars" id="over-stars" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="final" id="final-score">0</p>
    <p class="badge" id="new-best" data-text="newBest" hidden>New best!</p>
    <p class="over-note" id="over-note" hidden></p>
    <button type="button" class="btn btn-primary" id="btn-next" data-action="next"><span data-text="nextLevel">Next level</span></button>
    <button type="button" class="btn btn-primary" id="btn-retry" data-action="restart"><span id="btn-retry-label">Try again</span></button>
    <div class="row">
      <button type="button" class="btn btn-ghost" data-action="home"><span data-text="home">Home</span></button>
      <button type="button" class="btn btn-ghost" data-action="share"><span data-text="share">Share</span></button>
    </div>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/board.js"></script>
<script src="js/levels.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
</body>
</html>
